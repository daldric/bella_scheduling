<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Event Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111827;
    --surface: #1a2236;
    --line: #2a3550;
    --text: #e8ecf5;
    --muted: #8f9bb6;
    --accent: #7fd1c7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 32px; }

  .next { padding: 8px 0 40px; border-bottom: 1px solid var(--line); }
  .next .when { color: var(--muted); margin: 0 0 4px; }
  .next h2 { font-size: clamp(2rem, 7vw, 3.4rem); font-weight: 800; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  .next .where { color: var(--muted); font-size: 1.1rem; margin: 8px 0 0; }
  .units { margin-top: 28px; display: flex; gap: clamp(14px, 5vw, 40px); flex-wrap: wrap; }
  .unit b {
    display: block; font-size: clamp(2.6rem, 12vw, 5.5rem); font-weight: 800; line-height: 1;
    color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .unit span { color: var(--muted); font-size: 0.9rem; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .list .name { font-weight: 600; font-size: 1.1rem; }
  .list .date { color: var(--muted); font-size: 0.9rem; }
  .list .left { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }

  .note { color: var(--muted); padding: 24px; background: var(--surface); border-radius: 10px; }
  .note code { color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .cal { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--accent); }
  .list .cal { margin-top: 4px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Literally counting down the seconds until our next event</h1>
  <div id="app"></div>
</main>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS59fPJ8TzCSBF3prgMUK8O1p0CQHdI9KhHD1SPFSkdj6ECcOK0rvOWdkgC9CBG7eTqect3p4mhUq_Z/pub?gid=0&single=true&output=csv";
  const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1A1VET48GIV6QpmyI73XkmJTDdoaFA6Vest_Gto-vNOU/edit?usp=sharing"

  function addDays(d, h, m) {
    const t = new Date(); t.setDate(t.getDate() + d); t.setHours(h, m, 0, 0); return t;
  }

  // Minimal CSV parser (handles quoted fields)
  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); rows.push(row); row = []; cur = "";
      } else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  // Google Sheets sends dates and times exactly as they look in the sheet,
  // so accept the common formats instead of one strict one.
  const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

  // Returns [year, month, day] or null. Slash dates are read as US month/day/year.
  function parseDate(s) {
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return [+m[1], +m[2], +m[3]];                  // 2026-10-15
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)))                                             // 10/15/2026, 10/15/26
      return [m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[1], +m[2]];
    if ((m = s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/))) {              // Oct 15, 2026 / Thursday, October 15, 2026
      const mo = MONTHS.indexOf(m[1].toLowerCase()) + 1;
      if (mo) return [+m[3], mo, +m[2]];
    }
    if ((m = s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/))) {                              // 15 Oct 2026
      const mo = MONTHS.indexOf(m[2].toLowerCase()) + 1;
      if (mo) return [+m[3], mo, +m[1]];
    }
    return null;
  }

  // Returns [hours, minutes]; handles 18:30, 18:30:00, 6:30 PM, 6 pm. Blank = midnight.
  function parseTime(s) {
    const m = s.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*([ap])?\.?m?\.?$/i);
    if (!m) return [0, 0];
    let h = +m[1];
    const ap = (m[3] || "").toLowerCase();
    if (ap === "p" && h < 12) h += 12;
    if (ap === "a" && h === 12) h = 0;
    return [h, +(m[2] || 0)];
  }

  // Sheet columns: Event, Start Date, Start Time, End Date, End Time, Location (extra columns are ignored)
  function toEvents(rows) {
    return rows.slice(1).map(r => {
      const [name, startDate, startTime, endDate, endTime, location] = (r || []).map(s => (s || "").trim());
      const startDt = parseDate(startDate || "");
      const endDt = parseDate(endDate || "");
      if (!name || !startDt || !endDt) return null;
      const [startH, startMi] = parseTime(startTime || "");
      const whenStart = new Date(startDt[0], startDt[1] - 1, startDt[2], startH, startMi);
      const [endH, endMi] = parseTime(endTime || "");
      const whenEnd = new Date(endDt[0], endDt[1] - 1, endDt[2], endH, endMi);
      return isNaN(whenStart) | isNaN(whenEnd) ? null : { name, location, whenStart, whenEnd };
    }).filter(Boolean);
  }

  let events = [];
  const app = document.getElementById("app");
  const pad = n => String(n).padStart(2, "0");
  const fmt = d => d.toLocaleString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const fmtDay = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });

  function parts(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
  }

  function render() {
    const now = Date.now();
    const upcoming = events.filter(e => e.whenStart - now > 0).sort((a, b) => a.whenStart - b.whenStart);
    if (!upcoming.length) {
      app.innerHTML = '<p class="note">No upcoming events :( we gotta get something scheduled ASAP</p>';
      return;
    }
    const [first, ...rest] = upcoming;
    const p = parts(first.whenStart - now);
    app.innerHTML =
      '<p class="when"><a class="cal" href="' + esc(SHEET_EDIT_URL) + '" target="_blank" rel="noopener">Sheet to edit plans</a></p>' +
      '<section class="next">' +
        '<p class="when">Next up</p>' +
        '<h2>' + esc(first.name) + '</h2>' +
        '<p class="where">' + esc(fmt(first.whenStart)) + ' until ' + esc(fmt(first.whenEnd)) + '</p>' + 
        (first.location ? '<p class="where">' + esc(first.location) + ' &middot; ' + calButton(first) + '</p>' : '') +
        '<div class="units">' +
          unit(p.d, "days") + unit(pad(p.h), "hours") + unit(pad(p.m), "minutes") + unit(pad(p.s), "seconds") +
        '</div>' +
      '</section>' +
      '<ul class="list">' + rest.map(e => {
        const q = parts(e.whenStart - now);
        return '<li><div><div class="name">' + esc(e.name) + '</div><div class="date">' + esc(fmtDay(e.whenStart)) + ' - ' + esc(fmtDay(e.whenEnd)) + '</div>' +
               (e.location ? '<div class="date">' + esc(e.location) + '</div>' : '') + calButton(e) + '</div>' +
               '<div class="left">' + q.d + 'd ' + q.h + 'h ' + q.m + 'm</div></li>';
      }).join("") + '</ul>';
  }
  const unit = (n, l) => '<div class="unit"><b>' + n + '</b><span>' + l + '</span></div>';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  
  const TIMEZONE = "America/New_York"; // the time zone your sheet's times are in
  const calStamp = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
  const calLink = e => {
    const end = new Date(Math.max(e.whenEnd, e.whenStart)); end.setDate(end.getDate() + 1);
    return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
      action: "TEMPLATE", text: e.name, dates: icsDay(e.whenStart) + "/" + icsDay(end),
      location: e.location || "", details: fmt(e.whenStart) + " to " + fmt(e.whenEnd)
    });
  };
  
  const icsStamp = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/[,;]/g, "\\$&").replace(/\r?\n/g, "\\n");
  const icsDay = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const icsHref = e => {
    const end = new Date(Math.max(e.whenEnd, e.whenStart)); end.setDate(end.getDate() + 1); // all-day end is the day after the last day
    return "data:text/calendar;charset=utf-8," + encodeURIComponent([
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//bella_scheduling//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + icsDay(e.whenStart) + "-" + e.name.replace(/\W+/g, "") + "@bella_scheduling",
      "DTSTAMP:" + icsStamp(new Date()),
      "DTSTART;VALUE=DATE:" + icsDay(e.whenStart),
      "DTEND;VALUE=DATE:" + icsDay(end),
      "SUMMARY:" + icsEsc(e.name),
      "LOCATION:" + icsEsc(e.location),
      "DESCRIPTION:" + icsEsc(fmt(e.whenStart) + " to " + fmt(e.whenEnd)),
      "END:VEVENT", "END:VCALENDAR"
    ].join("\r\n"));
  };
  const calButton = e =>
    '<a class="cal" href="' + esc(calLink(e)) + '" target="_blank" rel="noopener">Add to Google Calendar</a>' + ' &middot; ' + 
    '<a class="cal" href="' + icsHref(e) + '" download="' + esc(e.name.replace(/\W+/g, "-")) + '.ics">Download Calendar Invite</a>';

    function tick() {
    const now = Date.now();
    const next = events.filter(e => e.whenStart - now > 0).sort((a, b) => a.whenStart - b.whenStart);
    const key = next.map(e => [e.name, e.whenStart.getTime(), e.whenEnd.getTime(), e.location].join("|")).join(",");
    if (key !== app.dataset.key) { app.dataset.key = key; render(); return; }
    if (!next.length) return;
    const p = parts(next[0].whenStart - now);
    const b = app.querySelectorAll(".unit b");
    if (b.length === 4) { b[0].textContent = p.d; b[1].textContent = pad(p.h); b[2].textContent = pad(p.m); b[3].textContent = pad(p.s); }
    app.querySelectorAll(".left").forEach((el, i) => {
      const q = parts(next[i + 1].whenStart - now);
      el.textContent = q.d + "d " + q.h + "h " + q.m + "m";
    });
  }

  async function load() {
    if (!SHEET_CSV_URL) { events = []; render(); return; }
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      events = toEvents(parseCSV(await res.text()));
      render();
    } catch (e) {
      if (!events.length) app.innerHTML = '<p class="note">Couldn\'t load events. Check that the sheet is published to the web as CSV and that <code>SHEET_CSV_URL</code> is correct.</p>';
    }
  }

  load();
  setInterval(render, 1000);
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
