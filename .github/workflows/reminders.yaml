name: Event reminders

on:
  schedule:
    - cron: "5 * * * *"   # every hour, at 5 minutes past
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed to save the logs in storage/

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS59fPJ8TzCSBF3prgMUK8O1p0CQHdI9KhHD1SPFSkdj6ECcOK0rvOWdkgC9CBG7eTqect3p4mhUq_Z/pub?gid=0&single=true&output=csv"
      TIMEZONE: "America/New_York"   # the time zone your sheet's times are in
      SITE_URL: "https://${{ github.repository_owner }}.github.io/bella_scheduling/"
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REMINDER_EMAILS: ${{ secrets.REMINDER_EMAILS }}
    steps:
      - uses: actions/checkout@v6

      - name: Send due reminders
        run: python3 scripts/send_reminders.py

      - name: Email new and changed events
        if: always()   # still runs if the reminders step failed
        run: python3 scripts/notify_changes.py

      - name: Save logs
        if: always()
        run: |
          if [ -n "$(git status --porcelain storage)" ]; then
            git config user.name "reminder-bot"
            git config user.email "reminder-bot@users.noreply.github.com"
            git add storage
            git commit -m "Update reminder logs"
            git pull --rebase
            git push
          fi